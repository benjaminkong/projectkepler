# Pipeline: typecheck + test every MR, build the Docker image on main, refresh datasets weekly.
# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected):
#   DEPLOY_HOOK_URL   - optional webhook to trigger a deploy after the image is pushed
#   ONEMAP_EMAIL, ONEMAP_PASSWORD - optional, speeds up school geocoding
#   GITLAB_PUSH_TOKEN - project access token (write_repository, api) for the data refresh MR

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

stages: [test, build, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

typecheck-and-test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - npm run typecheck
    - npm test
    - npm run build

docker-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  before_script: []
  cache: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $DEPLOY_HOOK_URL
  environment:
    name: production
  script:
    - curl -fsS -X POST "$DEPLOY_HOOK_URL"

# Create a schedule (Build > Pipeline schedules), e.g. every Monday 06:00 SGT.
refresh-data:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - apk add --no-cache git
    - npm run data:refresh
    - |
      if git diff --quiet -- packages/core/data/; then echo "Datasets unchanged"; exit 0; fi
      BRANCH="data-refresh-$(date +%Y%m%d)"
      git config user.email "ci@$CI_SERVER_HOST"
      git config user.name "Data refresh bot"
      git checkout -b "$BRANCH"
      git add packages/core/data/
      git commit -m "Refresh amenity datasets"
      git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH" \
        -o merge_request.create -o merge_request.target=$CI_DEFAULT_BRANCH -o merge_request.remove_source_branch
